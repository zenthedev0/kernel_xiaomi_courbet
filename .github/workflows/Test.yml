name: Android Kernel CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed to get commit history
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang \
          llvm \
          lld \
          build-essential \
          bc \
          libncurses-dev \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi

    - name: Set build environment
      run: |
        echo "KBUILD_BUILD_USER=Giyokun07" >> $GITHUB_ENV
        echo "KBUILD_BUILD_HOST=Dekstop" >> $GITHUB_ENV
        echo "LOCALVERSION=$LOCALVERSION" >> $GITHUB_ENV
        echo "Build environment set:"
        echo "User: $KBUILD_BUILD_USER"
        echo "Host: $KBUILD_BUILD_HOST"
        echo "Local version: $LOCALVERSION"

    - name: Configure kernel
      run: |
        cd $KERNEL_DIR
        make CC=clang ARCH=$ARCH O=out V=1 EXTRAVERSION="" $DEFCONFIG

    - name: Build kernel
      run: |
        cd $KERNEL_DIR
        make CC=clang LLVM=1 ARCH=$ARCH O=out -j$JOBS \
          HEADER_ARCH=$ARCH \
          SUBARCH=$ARCH \
          CXX=c++ \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          READELF=llvm-readelf \
          HOSTCXX=clang++ \
          HOSTAR=llvm-ar \
          LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          CLANG_TRIPLE=aarch64-linux-gnu-
        
    - name: Get build info
      id: build-info
      run: |
        echo "BUILD_DATE=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
        echo "KERNEL_VERSION=$(grep '^VERSION =' Makefile | awk '{print $3}')" >> $GITHUB_OUTPUT || echo "KERNEL_VERSION=4.14.356-openela-rc1" >> $GITHUB_OUTPUT
        echo "COMMIT=$(git log -1 --pretty=format:'%h')" >> $GITHUB_OUTPUT
        echo "DURATION=$(( ( $(date +%s) - $(date -d "${{ github.workflow_run.created_at }}" +%s) ) / 60 )) minutes" >> $GITHUB_OUTPUT
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-${{ steps.build-info.outputs.BUILD_DATE }}
        path: out/arch/arm64/boot/
        
    - name: Send Telegram notification
      if: success()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: ✅ Kernel Build Success!
                 🔧 Version: ${{ steps.build-info.outputs.KERNEL_VERSION }}
                 🕒 Built at: ${{ steps.build-info.outputs.BUILD_DATE }}
                 ⏱ Duration: ${{ steps.build-info.outputs.DURATION }}
                 🔨 Commit: ${{ steps.build-info.outputs.COMMIT }}
       document: ${{ steps.<step id>.outputs.outfile }}
