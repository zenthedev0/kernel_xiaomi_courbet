name: Kernel Build Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  KBUILD_BUILD_USER: Giyokun07
  KBUILD_BUILD_HOST: Desktop
  LOCALVERSION: "-RedLabel"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get commit hash
      id: commit
      run: echo "commit_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm lld build-essential bc libncurses-dev bison flex libssl-dev libelf-dev

    - name: Start build timer
      id: timer
      run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

    - name: Build kernel
      run: |
        make CC=clang ARCH=arm64 O=out V=1 EXTRAVERSION="" courbet_defconfig
        make CC=clang LLVM=1 ARCH=arm64 O=out -j16 \
                HEADER_ARCH=arm64 \
                SUBARCH=arm64 \
                CXX=c++ \
                AR=llvm-ar \
                NM=llvm-nm \
                OBJDUMP=llvm-objdump \
                STRIP=llvm-strip \
                READELF=llvm-readelf \
                HOSTCXX=clang++ \
                HOSTAR=llvm-ar \
                LLVM_IAS=1 \
                CROSS_COMPILE=aarch64-linux-gnu- \
                CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                CLANG_TRIPLE=aarch64-linux-gnu-

    - name: Get kernel version
      id: kernel_version
      run: |
        VERSION=$(make kernelversion 2>/dev/null || echo "unknown")
        echo "kernel_version=$VERSION$LOCALVERSION" >> $GITHUB_OUTPUT

    - name: Find and package kernel files
      run: |
       # Debug: List all relevant files
       find out/ -type f \( -name "Image.gz" -o -name "dtb.img" -o -name "dtbo.img" \) -exec echo "Found: {}" \;

       # Create release dir and copy files (update paths if needed)
       mkdir -p kernel_release
       cp out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dtb.img out/arch/arm64/boot/dtbo.img kernel_release/ || true

       # Create tarball
       tar -czvf kernel_${{ steps.kernel_version.outputs.kernel_version }}.tar.gz kernel_release/

       # Verify the tarball exists
       ls -lh kernel_*.tar.gz

    - name: Upload artifact (for GitHub)
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: kernel_${{ steps.kernel_version.outputs.kernel_version }}.tar.gz

    - name: Get current timestamp
      id: date
      run: echo "formatted_date=$(date +'%Y/%m/%d %H:%M')" >> $GITHUB_OUTPUT

    - name: Send Telegram notification
      if: success()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          ✅ Kernel Build Success!
          🔧 Version: ${{ steps.kernel_version.outputs.kernel_version }}
          🕒 Built at: ${{ steps.date.outputs.formatted_date }}
          ⏱ Duration: ${{ steps.duration.outputs.duration }} seconds
          🔨 Commit: ${{ steps.commit.outputs.commit_short }}
        document: kernel_${{ steps.kernel_version.outputs.kernel_version }}.tar.gz
